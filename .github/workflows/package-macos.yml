name: package-macOS

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Minimalne uprawnienia
permissions:
  contents: read

# Zapobiega dublowaniu jobów na ten sam branch
concurrency:
  group: package-macOS-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-latest ]   # arm64 runner (Apple Silicon)
        haxe: [ 4.3.3 ]
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Haxe na arm64
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ matrix.haxe }}

      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM (Node 14 jeśli projekt tego wymaga)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Lepiej deterministycznie: ci (o ile masz package-lock.json)
      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Pack prepare
        run: npm run pack-prepare
        working-directory: app

      - name: Pack macOS
        run: npm run pack-macos
        working-directory: app

      # Upload artefaktu .dmg do GitHuba
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-distribution
          path: app/redist/*installer.dmg
