name: package-macOS

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Minimalne uprawnienia
permissions:
  contents: read

# Zapobiega dublowaniu jobów na ten sam branch
concurrency:
  group: package-macOS-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-latest ]   # arm64 runner (Apple Silicon)
        haxe: [ 4.3.3 ]
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Instalacja Haxe przez Homebrew (obsługuje ARM64)
      - name: Install Haxe via Homebrew
        run: |
          brew install haxe
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      # Weryfikacja instalacji
      - name: Verify Haxe installation
        run: |
          haxe -version
          echo "Haxe standard library path: $HAXE_STD_PATH"

      # Uruchomienie setup.hxml
      - name: Setup Haxe libraries
        run: haxe setup.hxml

      - name: List Haxe libraries
        run: haxelib list

      # Node/NPM 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Instalacja zależności
      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Pack prepare
        run: npm run pack-prepare
        working-directory: app

      - name: Pack macOS
        run: npm run pack-macos
        working-directory: app

      # Upload artefaktu .dmg do GitHuba
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-distribution
          path: app/redist/*installer.dmg
